<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf3e6">
  <title>Digital Gift</title>

  <!-- Font: serif elegan (Cormorant Garamond) + sans modern (Jost).
       Jika offline, otomatis memakai font cadangan di style.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="is-locked" data-theme="light">

  <!-- ===== LATAR BELAKANG (berganti warna sesuai halaman) ===== -->
  <div class="bg" aria-hidden="true">
    <i class="bg__layer bg__layer--light"></i>
    <i class="bg__layer bg__layer--pink"></i>
    <i class="bg__layer bg__layer--dark"></i>
  </div>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="petals" aria-hidden="true"></div>

  <!-- =====================================================
       HALAMAN PEMBUKA — teks diisi dari CONFIG (script.js)
       ===================================================== -->
  <section id="intro" class="intro" aria-label="Halaman pembuka">
    <div class="intro__inner">
      <h1 class="intro__title" data-text="intro.title"></h1>
      <p class="intro__subtitle" data-text="intro.subtitle"></p>

      <!-- Amplop digital -->
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Amplop hadiah">
        <div class="envelope__back"></div>
        <div class="envelope__letter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="envelope__front"></div>
        <div class="envelope__flap"></div>
        <div class="envelope__seal" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
      </div>

      <button type="button" class="btn btn--primary" id="openGift" data-text="intro.buttonLabel"></button>
    </div>
  </section>

  <!-- =====================================================
       HALAMAN UTAMA
       ===================================================== -->
  <main id="app" class="app" hidden>

    <!-- Navigasi (diisi oleh JavaScript dari CONFIG.nav) -->
    <nav class="nav" id="nav" aria-label="Navigasi utama"></nav>

    <!-- ---------- HOME ---------- -->
    <section class="view view-home" data-view="home" aria-label="Home">
      <div class="home__frame">
        <p class="eyebrow" data-text="home.eyebrow"></p>
        <h2 class="home__title" data-text="home.title"></h2>
        <svg class="ornament" viewBox="0 0 200 20" aria-hidden="true">
          <line x1="10" y1="10" x2="82" y2="10"/>
          <path d="M100 16 C91 10 91 4 96.500 4 C98.800 4 100 6.200 100 6.200 C100 6.200 101.200 4 103.500 4 C109 4 109 10 100 16Z"/>
          <line x1="118" y1="10" x2="190" y2="10"/>
        </svg>
        <p class="home__subtitle" data-text="home.subtitle"></p>

        <dl class="home__meta">
          <div><dt data-text="labels.to"></dt><dd data-text="recipientName"></dd></div>
          <div><dt data-text="labels.from"></dt><dd data-text="senderName"></dd></div>
          <div><dt data-text="labels.date"></dt><dd data-text="date"></dd></div>
        </dl>

        <button type="button" class="icon-btn" data-goto="ucapan" aria-label="Lanjut ke bagian berikutnya">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>

    <!-- ---------- UCAPAN ---------- -->
    <section class="view view-ucapan" data-view="ucapan" aria-label="Ucapan">
      <header class="view__head">
        <h2 class="view__title" data-text="ucapan.title"></h2>
        <label class="switch">
          <input type="checkbox" class="js-typing-toggle">
          <span class="switch__track"></span>
          <span class="switch__label" data-text="labels.typing"></span>
        </label>
      </header>

      <article class="card-letter">
        <div class="seal" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <h3 class="card-letter__greeting" data-text="ucapan.greeting"></h3>
        <div class="card-letter__body" id="ucapanBody"></div>
        <p class="card-letter__sign" data-text="ucapan.signature"></p>
      </article>
    </section>

    <!-- ---------- PUISI ---------- -->
    <section class="view view-puisi" data-view="puisi" aria-label="Puisi">
      <header class="view__head">
        <h2 class="view__title" data-text="puisi.title"></h2>
      </header>
      <!-- Kartu puisi dibuat oleh JavaScript dari CONFIG.puisi.cards -->
      <div class="poem-list" id="poemList"></div>
    </section>

    <!-- ---------- UNGKAPAN ---------- -->
    <section class="view view-ungkapan" data-view="ungkapan" aria-label="Ungkapan">
      <header class="view__head">
        <h2 class="view__title" data-text="ungkapan.title"></h2>
        <label class="switch">
          <input type="checkbox" class="js-typing-toggle">
          <span class="switch__track"></span>
          <span class="switch__label" data-text="labels.typing"></span>
        </label>
      </header>

      <div class="letterbox" id="letterBox">
        <div class="envelope envelope--sm" id="letterEnvelope" role="button" tabindex="0" aria-expanded="false" aria-label="Buka surat">
          <div class="envelope__back"></div>
          <div class="envelope__letter" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="envelope__front"></div>
          <div class="envelope__flap"></div>
          <div class="envelope__seal" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
        </div>
        <p class="hint" id="letterHint" data-text="labels.openLetter"></p>

        <div class="paper-wrap">
          <div class="paper-wrap__inner">
            <article class="paper">
              <h3 class="paper__title" data-text="ungkapan.letterTitle"></h3>
              <div class="paper__body" id="ungkapanBody"></div>
              <p class="paper__sign" data-text="ungkapan.signature"></p>
            </article>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------- GALERI ---------- -->
    <section class="view view-galeri" data-view="galeri" aria-label="Galeri">
      <header class="view__head">
        <h2 class="view__title" data-text="galeri.title"></h2>
      </header>
      <!-- Polaroid dibuat oleh JavaScript dari CONFIG.galeri.photos -->
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- ---------- PENUTUP ---------- -->
    <section class="view view-penutup" data-view="penutup" aria-label="Penutup">
      <header class="view__head">
        <h2 class="view__title" data-text="penutup.title"></h2>
      </header>

      <!-- Kotak hadiah interaktif -->
      <div class="giftbox" id="giftbox" role="button" tabindex="0" aria-expanded="false" aria-label="Kotak hadiah">
        <div class="giftbox__lid"><span class="giftbox__bow"></span></div>
        <div class="giftbox__body"></div>
      </div>
      <p class="hint" id="giftHint" data-text="labels.openGift"></p>

      <!-- Panel pesan penutup (terbuka saat kotak diklik) -->
      <div class="closing" id="closingPanel">
        <div class="closing__inner">
          <article class="closing__card">
            <div class="closing__body" id="closingBody"></div>
            <p class="closing__sign" data-text="penutup.signature"></p>
            <p class="closing__date" data-text="penutup.date"></p>
          </article>
        </div>
      </div>
    </section>
  </main>

  <!-- =====================================================
       PEMUTAR MUSIK (muncul setelah hadiah dibuka)
       ===================================================== -->
  <div class="player" id="player" hidden>
    <button type="button" class="player__btn" id="playBtn" aria-label="Putar musik" aria-pressed="false">
      <svg class="player__icon player__icon--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="player__icon player__icon--pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
  </div>
  <!-- Sumber audio diatur di CONFIG.music.src (script.js) -->
  <audio id="audio" preload="none" loop></audio>

  <!-- =====================================================
       LIGHTBOX FOTO (perbesar foto)
       ===================================================== -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto diperbesar" aria-hidden="true">
    <button type="button" class="lightbox__close" id="lbClose" aria-label="Tutup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button type="button" class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Foto sebelumnya">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <figure class="lightbox__fig">
      <div class="lightbox__media" id="lbMedia"></div>
      <figcaption class="lightbox__caption" id="lbCaption"></figcaption>
    </figure>
    <button type="button" class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Foto berikutnya">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
